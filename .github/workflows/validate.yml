name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # schema/importer/generator hängen bewusst nur an PyYAML – keine HA-Testumgebung nötig.
      - run: pip install pyyaml pytest
      - run: pytest -q

      # Die Panel-Hilfsfunktionen (Widget-Wahl, Key-Löschregel) laufen ohne DOM im Node-Runner.
      - uses: actions/setup-node@v4
        with:
          # 22 statt 20: gleiche Major-Version wie lokal getestet, und 20 ist auf den Runnern
          # inzwischen abgekündigt.
          node-version: "22"
      - run: node --test tests/panel.test.mjs

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Diese zwei Pruefungen holen hacs.json bzw. manifest.json ueber die GitHub-API — ohne
          # Token. Solange das Repo PRIVAT ist, bekommt die Action 404 und damit `None`, und beide
          # schlagen unabhaengig vom Inhalt fehl ("expected a dictionary. Got None"). Ersatz ohne
          # Netz: tests/test_manifests.py prueft beide Dateien gegen dieselben HACS-Schemata.
          # >>> Beim Oeffentlich-Schalten des Repos diese ignore-Zeile entfernen. <<<
          ignore: hacsjson integration_manifest
