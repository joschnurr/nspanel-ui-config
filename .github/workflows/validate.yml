name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # schema/importer/generator hängen bewusst nur an PyYAML – keine HA-Testumgebung nötig.
      - run: pip install pyyaml pytest
      - run: pytest -q

      # Die Panel-Hilfsfunktionen (Widget-Wahl, Key-Löschregel) laufen ohne DOM im Node-Runner.
      # Der Test importiert `nspanel-ui-config-panel.js` direkt; die Datei ist ein ES-Modul, heißt
      # aber `.js`. Damit Node sie nicht als CommonJS liest, steht `"type": "module"` in der
      # package.json im Wurzelverzeichnis — ohne sie läuft der Test nur auf Node ≥ 22.7, wo die
      # Modul-Erkennung standardmäßig an ist, und scheitert auf älteren 22ern mit
      # „Cannot use import statement outside a module".
      - uses: actions/setup-node@v4
        with:
          # 22 statt 20: gleiche Major-Version wie lokal getestet, und 20 ist auf den Runnern
          # inzwischen abgekündigt.
          node-version: "22"
      # Glob statt `--test tests/`: das Verzeichnis-Argument gibt es erst ab Node 22.6, die Shell
      # löst den Glob dagegen überall auf – und neue Testdateien laufen trotzdem automatisch mit.
      - run: node --test tests/*.test.mjs

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Die Pruefungen hacsjson/integration_manifest holen hacs.json bzw. manifest.json ueber
          # die GitHub-API ohne Token. Solange das Repo privat war, kam dort 404 zurueck und beide
          # schlugen unabhaengig vom Inhalt fehl; sie standen deshalb auf ignore. Seit das Repo
          # oeffentlich ist, laufen sie regulaer mit. tests/test_manifests.py prueft dieselben
          # Regeln zusaetzlich lokal, also auch ohne Netz.
